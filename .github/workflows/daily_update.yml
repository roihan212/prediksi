name: Daily Stock Data & Prediction Update

on:
  schedule:
    # Jalan otomatis setiap Senin-Jumat pukul 10:00 UTC (17:00 WIB) setelah pasar BEI tutup
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # Bisa juga dijalankan manual lewat tab Actions di GitHub

permissions:
  contents: write

jobs:
  update-stock-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backfill & Daily Predictions
        working-directory: backend
        run: |
          python app/ml/backfill_predictions.py

      - name: Export Static JSON Snapshots
        working-directory: backend
        run: |
          python app/ml/export_static_json.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add backend/stockpredict.db frontend/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily stock prices, predictions & JSON snapshots" && git push)
