<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockPredict — Prediksi Saham Perbankan Indonesia</title>
  <meta name="description" content="Aplikasi prediksi saham sektor perbankan BEI menggunakan Random Forest dan indikator teknikal. Analisis BBCA, BBRI, BBNI, BMRI, BRIS." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <!-- Sidebar Navigation -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
          <polyline points="16 7 22 7 22 13"/>
        </svg>
      </div>
      <span class="logo-text">StockPredict</span>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">MENU UTAMA</div>
      <a href="#" class="nav-item active" data-page="dashboard" id="nav-dashboard">
        <i data-lucide="layout-dashboard"></i>
        <span>Dashboard</span>
      </a>
      <a href="#" class="nav-item" data-page="prediction" id="nav-prediction">
        <i data-lucide="brain-circuit"></i>
        <span>Prediksi</span>
        <span class="nav-badge">Live</span>
      </a>
      <a href="#" class="nav-item" data-page="stocks" id="nav-stocks">
        <i data-lucide="bar-chart-2"></i>
        <span>Saham</span>
      </a>
      <a href="#" class="nav-item" data-page="backtesting" id="nav-backtesting">
        <i data-lucide="flask-conical"></i>
        <span>Backtesting</span>
      </a>

      <div class="nav-section-label" style="margin-top:1.5rem;">ANALISIS</div>
      <a href="#" class="nav-item" data-page="technical" id="nav-technical">
        <i data-lucide="activity"></i>
        <span>Indikator Teknikal</span>
      </a>
      <a href="#" class="nav-item" data-page="experiments" id="nav-experiments">
        <i data-lucide="beaker"></i>
        <span>Eksperimen ML</span>
      </a>

      <div class="nav-section-label" style="margin-top:1.5rem;">SISTEM</div>
      <a href="#" class="nav-item" data-page="admin" id="nav-admin">
        <i data-lucide="settings-2"></i>
        <span>Admin Panel</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="market-status" id="market-status">
        <span class="status-dot"></span>
        <span class="status-text">Pasar Tutup</span>
      </div>
    </div>
  </aside>

  <!-- Mobile overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Main Content -->
  <main class="main-content" id="main-content">
    <!-- Top Header -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-hamburger" id="btn-hamburger">
          <i data-lucide="menu"></i>
        </button>
        <div class="breadcrumb" id="breadcrumb">
          <span>Dashboard</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-time" id="topbar-time"></div>
        <button class="btn-icon" id="btn-refresh" title="Refresh data">
          <i data-lucide="refresh-cw"></i>
        </button>
      </div>
    </header>

    <!-- Page Container -->
    <div class="page-container" id="page-container">
      <!-- Pages injected by JS -->
    </div>
  </main>

  <!-- Toast Notification -->
  <div class="toast-container" id="toast-container"></div>

  <!-- JS Modules -->
  <script src="js/services/api.js"></script>
  <script src="js/components/charts.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/prediction.js"></script>
  <script src="js/pages/stocks.js"></script>
  <script src="js/pages/backtesting.js"></script>
  <script src="js/pages/technical.js"></script>
  <script src="js/pages/experiments.js"></script>
  <script src="js/pages/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
